# Release pipeline: tag push (v*) -> build -> test -> publish -> GitHub Release.
# workflow_dispatch runs build+test only: the publish/rename/Release steps are
# tag-gated below, so a manual dispatch never creates a Release.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        # Pinned to match global.json (11.0.100, rollForward latestFeature);
        # not relying on runner preinstalls.
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100

      - name: Build (Release)
        run: dotnet build -c Release

      - name: Test
        run: dotnet test

      - name: Publish CLI single-file exe
        # -p:Version=<tag minus v> stamps the assembly version so `link-manager
        # version` / version --json match the Release tag; overrides the csproj
        # local-default <Version>.
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          dotnet publish src/LinkManager.Cli/LinkManager.Cli.csproj -c Release
          -p:Version=$("${{ github.ref_name }}" -replace '^v', '')

      - name: Publish GUI single-file exe
        # GUI csproj has no publish profile; all single-file flags come from the
        # command line. The csproj KeepIjwAssembliesOutOfBundle target keeps the
        # IJW mixed-mode assemblies (DirectWriteForwarder/System.Printing/
        # ijwhost, dotnet/wpf#11842) out of the bundle as loose files, so
        # IncludeNativeLibrariesForSelfExtract is not needed and compression
        # applies (wpfgfx_cor3 etc. stay bundled — those load fine from memory).
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          dotnet publish src/LinkManager.Gui/LinkManager.Gui.csproj -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:Version=$("${{ github.ref_name }}" -replace '^v', '')

      - name: Name asset for the tag
        # GUI ships as a zip: the IJW workaround (dotnet/wpf#11842) publishes
        # loose DLLs next to the exe, which only travel together if packaged;
        # scoop extracts a zip asset so the DLLs land in the app dir.
        # Zip root holds the files directly (no nesting), so the manifest needs
        # no extract_dir.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          Copy-Item "src/LinkManager.Cli/bin/Release/net11.0-windows/win-x64/publish/LinkManager.Cli.exe" "link-manager-$env:TAG_NAME-win-x64.exe"
          Compress-Archive -Path "src/LinkManager.Gui/bin/Release/net11.0-windows/win-x64/publish/*" -DestinationPath "link-manager-gui-$env:TAG_NAME-win-x64.zip" -CompressionLevel Optimal

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            link-manager-${{ github.ref_name }}-win-x64.exe
            link-manager-gui-${{ github.ref_name }}-win-x64.zip
